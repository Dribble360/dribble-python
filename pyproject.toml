[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dribble"
version = "0.1.0"
description = "Python client for the Dribble football data API (Opta-sourced)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Dribble Inc.", email = "bw@dribble360.com" }]
keywords = ["football", "soccer", "opta", "xg", "sports-data", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "pyyaml>=6"]

[project.urls]
Homepage = "https://dribble360.com"
Pricing = "https://dribble360.com/pricing"
Documentation = "https://dribble360.com/api-subscribers"

[tool.hatch.build.targets.wheel]
packages = ["dribble"]
